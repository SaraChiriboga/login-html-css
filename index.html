<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdminExpress – Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="wrapper">

    <!-- panel de marca, visible solo en pantallas grandes -->
    <aside class="brand-panel">
      <h1>AdminExpress</h1>
    </aside>

    <!-- contenido principal: el formulario -->
    <main class="form-panel">

      <section class="form-card">

        <header class="form-header">
          <h2>Let's <strong>Sign In</strong> 👋</h2>
          <p>Hey, Enter your details to get sign in to your account.</p>
        </header>

        <form action="#" method="post">

          <fieldset>
            <legend>Credenciales de acceso</legend>

            <!-- campo email -->
            <div class="field">
              <label for="email">Email</label>
              <div class="input-box">
                <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M2 7l10 7 10-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="Enter Email" autocomplete="email" required />
              </div>
            </div>

            <!-- campo contraseña -->
            <div class="field">
              <label for="password">Password</label>
              <div class="input-box">
                <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required />
                <svg class="icon icon-right" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </div>
              <a href="#" class="forgot">Forgot password?</a>
            </div>

          </fieldset>

          <button type="submit">Sign In</button>

        </form>

        <footer class="form-footer">
          <p>Don't have an account? <a href="#">Sign Up</a></p>
        </footer>

      </section>

    </main>

  </div>

</body>
</html>
